name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opentales
          POSTGRES_PASSWORD: opentales
          POSTGRES_DB: opentales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opentales -d opentales_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://opentales:opentales@127.0.0.1:5432/opentales_test?schema=public
      EXPORT_IMPORT_TEST_DATABASE_URL: postgresql://opentales:opentales@127.0.0.1:5432/opentales_test?schema=public
      REVISION_TEST_DATABASE_URL: postgresql://opentales:opentales@127.0.0.1:5432/opentales_test?schema=public
      RENAME_REFACTOR_TEST_DATABASE_URL: postgresql://opentales:opentales@127.0.0.1:5432/opentales_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/backend prisma:generate
      - run: pnpm --dir packages/backend exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm --dir packages/backend test:critical-coverage
      - run: pnpm build
      - name: Build deployment images
        run: |
          docker build -f packages/backend/Dockerfile -t opentales-backend:ci .
          docker build -f packages/frontend/Dockerfile -t opentales-frontend:ci .
      - name: Verify embedded agent startup and persistence
        run: |
          docker volume create opencode-smoke
          for mode in write read; do
            docker run --rm --entrypoint node \
              -e DATABASE_URL -e JWT_SECRET -e CORS_ORIGIN \
              -e OPENCODE_DATA_DIR=/data/opencode \
              -v opencode-smoke:/data/opencode \
              opentales-backend:ci scripts/smoke-opencode.mjs "$mode"
          done
      - name: Verify deployment startup and migrations
        run: |
          docker run -d --name backend-smoke --network host \
            -e DATABASE_URL -e JWT_SECRET -e CORS_ORIGIN opentales-backend:ci
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:4000/health
          docker run -d --name frontend-smoke -p 8080:80 opentales-frontend:ci
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/health
          curl --fail http://localhost:8080/app.html -o /tmp/app.html
          curl --fail http://localhost:8080/projects/smoke -o /tmp/deep-link.html
          cmp /tmp/app.html /tmp/deep-link.html
      - name: Deployment diagnostics and cleanup
        if: always()
        run: |
          docker logs backend-smoke 2>/dev/null || true
          docker logs frontend-smoke 2>/dev/null || true
          docker rm -f backend-smoke frontend-smoke 2>/dev/null || true
          docker volume rm opencode-smoke 2>/dev/null || true
