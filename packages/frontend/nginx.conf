server {
  listen 80;
  server_name _;

  # Docker service IPs can change during a rolling Compose deployment. Resolve
  # the backend at request time so Nginx does not retain a replaced container's IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream backend:4000;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /authorize {
    access_log off;
    try_files /authorize/index.html /app.html;
  }

  location ^~ /authorize/ {
    access_log off;
    try_files $uri $uri/ /authorize/index.html;
  }

  location = /mcp {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  location ~ ^/(token|register|revoke)$ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
  }

  location ^~ /.well-known/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
